[package]
name = "airlock"
version = "0.2.0"
edition = "2024"
authors = ["Charles Adedotun <charles.adedotun8@gmail.com>"]
license = "MIT"
description = "High-throughput streaming proxy, single-upstream arbiter, and zero-copy MPEG-TS ring buffer in Safe Rust."
repository = "https://github.com/charles-adedotun/airlock"
readme = "README.md"

[lib]
name = "airlock"
path = "src/lib.rs"

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "socks"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.7"
futures-util = "0.3"
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
regex = "1.10"
dunce = "1.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
parking_lot = "0.12"

[dev-dependencies]
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "ring_bench"
harness = false
